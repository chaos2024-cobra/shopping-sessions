[package]
name = "shopstats"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "shopstats"
path = "src/main.rs"

[dependencies]
rayon = "1.10"
memchr = "2.7"
memmap2 = "0.9"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
mimalloc = { version = "0.1", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
